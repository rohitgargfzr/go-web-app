name: go-web-app-ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'helm/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout git repo
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Verify dependencies
        run: go mod download && go mod verify
      
      - name: build app
        run: go build -o main .

      - name: run tests
        run: go test
  
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: checkout git repo
        uses: actions/checkout@v7

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
            # Optional: Specify the exact version of the linter tool
            version: v1.28.3
  
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Set up Docker Buildx (enables advanced caching and multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{github.run_id}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  Update-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Image Tag in Helm values.yaml
        run: |
          # Uses sed to find "tag: <anything>" under the image section and swap it out
          # Alternatively, use yq: yq -i '.image.tag = "${{ github.run_id }}"' charts/my-go-app/values.yaml
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' ./go-web-app/helm/my-go-app-chart/values.yaml

      - name: Commit and Push Updated Helm Chart
        run: |
          git config --global user.name "rohitgargfzr"
          git config --global user.email "rohit.gargfzr@gmail.com"
          git add ./go-web-app/helm/my-go-app-chart/values.yaml
          git commit -m "chore: update container image tag to ${{ github.run_id }} [skip ci]"
          git push




